{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Register your team</h1>
<p>Anyone can register and play. Pick a team name (solo play is fine --
a "team" can be one person).</p>
<form id="register-form" x-data="{ error: '' }" @submit.prevent="
  fetch('/api/auth/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      name: $refs.name.value,
      password: $refs.password.value,
      confirm_password: $refs.confirm_password.value,
      website: $refs.website.value,
      form_token: '{{ form_token }}',
    }),
  }).then(async r => {
    if (r.ok) { window.location.href = '/challenges'; return; }
    const body = await r.json();
    error = body.detail || 'registration failed';
  })
">
  <label>Team name <input x-ref="name" name="name" required maxlength="64"></label>
  <label>Password <input x-ref="password" type="password" name="password" required minlength="8"></label>
  <label>Confirm password <input x-ref="confirm_password" type="password" name="confirm_password" required minlength="8"></label>
  <!-- Honeypot: hidden from real users via CSS, left empty. Any bot's
       generic form-filler is the one thing expected to populate it. -->
  <div class="hp-field"><label>Website <input x-ref="website" name="website" autocomplete="off" tabindex="-1"></label></div>
  <button type="submit">Register</button>
  <p x-show="error" x-text="error" class="error"></p>
</form>
<p>Already registered? <a href="/login">Log in</a>.</p>
{% endblock %}
