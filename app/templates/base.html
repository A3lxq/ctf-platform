<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Halcyon Protocol{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/alpinejs.min.js" defer></script>
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header
    x-data="{ role: null, name: null, eventName: 'Halcyon Protocol',
      logout() {
        fetch('/api/auth/logout', { method: 'POST' }).then(() => window.location.href = '/');
      }
    }"
    x-init="
      fetch('/api/auth/me').then(r => r.ok ? r.json() : null).then(me => {
        if (me) { role = me.role; name = me.name || me.username; }
      });
      fetch('/api/settings').then(r => r.json()).then(s => { eventName = s.name; });
    "
  >
    <nav>
      <a href="/" class="brand" x-text="eventName"></a>
      <span class="nav-links">
        <template x-if="role === 'team'">
          <span>
            <a href="/challenges">Challenges</a>
            <a href="/scoreboard">Scoreboard</a>
            <span class="nav-who" x-text="name"></span>
            <a href="#" @click.prevent="logout()">Log out</a>
          </span>
        </template>
        <template x-if="role === 'admin'">
          <span>
            <a href="/admin/games">Admin</a>
            <span class="nav-who" x-text="name"></span>
            <a href="#" @click.prevent="logout()">Log out</a>
          </span>
        </template>
        <template x-if="!role">
          <span>
            <a href="/login">Log in</a>
            <a href="/register">Register</a>
          </span>
        </template>
      </span>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
